[project]
name = "gds-idea-pkg-oc"
description = "Sync approved OpenCode agent skills to a developer's machine"
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]
dynamic = ["version"]

[project.scripts]
idea-oc = "idea_oc.cli:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/idea_oc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_oc"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["src/idea_oc/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["idea_oc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: tests that require external services"]

[tool.gds-idea-app-kit]
framework = "python"
app_name = "oc"
tool_version = "0.6.0"

[tool.gds-idea-app-kit.files]
LICENCE = "sha256:21cc325b3181cb748845827425d37ce04b3dc563835bbf50fafbc56a5eb68c48"
".github/CODEOWNERS" = "sha256:464aa53eb8be8c9b61185674b4dabec6cacbafa904aa48b46facdcd9a18e1fc5"
".github/workflows/ci.yml" = "sha256:8d7c4828d9f5eaa94fa767d6e2bc202ce7a0ed1145d3d445fc669e61c751ff21"
".github/dependabot.yml" = "sha256:8472c537c3808394c9200ac7f67e61ce565981583c6f7f381339f1df255fb318"
".pre-commit-config.yaml" = "sha256:376617ea56a3e3b6691e423e33c1faeff299e95205c54208bbd3b3a5c619bd57"
".github/workflows/release.yml" = "sha256:d2c22e66042f7f7fca4dc1066ff3ffaa4303df9c8a57953684a0a927731b1fe6"
[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.0.0",
    "pytest-httpx>=0.34",
    "ruff>=0.14.0",
]
