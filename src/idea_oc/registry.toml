# Approved skill sources for idea-oc.
#
# Changes here are the approval mechanism: raise a PR, get CODEOWNERS review,
# and users receive the change when they upgrade idea-oc.
#
# Each [[source]] sets exactly one of:
#   discover = "<folder>"      install every subfolder containing SKILL.md
#   skills   = ["<path>", ...] install named skills (a folder or a SKILL.md file)
#
# ref = "latest" follows the newest release of the repo. Set a tag or commit
# SHA to pin a source.

allowed_owners = ["co-cddo"]

[[source]]
repo = "co-cddo/gds-idea-ai-reviewer"
discover = "src/ai_reviewer/skills"
ref = "latest"

# The agent skills for the team's own CLI tools live next to the code they describe, so they change in
# the same pull request as the tool. Each is a named skill (not discovered), so only what is listed
# here is installed.
[[source]]
repo = "co-cddo/gds-idea-app-kit"
skills = ["skills/idea-app-usage"]

[[source]]
repo = "co-cddo/gds-idea-gh-kit"
skills = ["skills/idea-gh-usage"]
